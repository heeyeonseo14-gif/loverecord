<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d58aa8"><title>陪伴 · ROSE ÉTERNELLE</title><link rel="stylesheet" href="./companion.css?v=3"></head>
<body><div class="app">
<header class="topbar"><button id="backHome" class="back">‹ 返回 LOVE RECORD</button><div class="brand">ROSE ÉTERNELLE <span>COMPANION</span></div></header>
<main id="appMain">
<section id="chooseView" class="view active">
<div class="intro"><div class="eyebrow">A LITTLE WORLD OF US</div><h1>与你珍藏的<br><em>每一个瞬间</em></h1><p>选择一位联系人，进入你们专属的陪伴空间。</p></div>
<div id="peopleGrid" class="people-grid"></div><div class="footnote">每一段关系，都有独属于它的记忆。</div>
</section>
<section id="spaceView" class="view">
<div class="cover-card" id="coverCard">
<div class="cover-glow"></div><div class="cover-top"><button id="changeContact" class="textbtn">‹ 联系人</button><span class="cover-label">OUR STORY · EST.</span></div>
<div class="couple"><button class="avatar avatar-upload" id="personAvatar" type="button" aria-label="更换联系人照片">♡</button><div class="heart">♥</div><button class="avatar self-avatar avatar-upload" id="selfAvatar" type="button" aria-label="更换自己的照片">✧</button><input id="personPhotoInput" type="file" accept="image/*" hidden><input id="selfPhotoInput" type="file" accept="image/*" hidden></div>
<div class="couple-names"><strong id="personName">TA</strong><span>&</span><strong id="selfName">YOU</strong></div>
<div class="days"><strong id="daysCount">—</strong><span> DAYS TOGETHER</span></div><div class="anniversary" id="anniversaryText">设置你们的纪念日，让每一天都有意义</div>
<div class="cover-actions"><button id="editCover" class="ghostbtn">编辑关系卡片</button></div>
</div>
<div class="section-title"><div><span class="section-kicker">KEEP OUR LITTLE THINGS</span><h2>我们的故事</h2></div><span class="rose-mark">✿</span></div>
<div class="feature-grid">
<button class="feature" data-feature="letters"><span class="feature-icon">✉</span><b>私人信箱</b><small>把想说的话留下</small></button>
<button class="feature" data-feature="memories"><span class="feature-icon">▧</span><b>双人回忆册</b><small>珍藏共同经历</small></button>
<button class="feature" data-feature="events"><span class="feature-icon">♧</span><b>纪念日与约定</b><small>记住重要的日子</small></button>
<button class="feature" data-feature="moods"><span class="feature-icon">☾</span><b>心情日记</b><small>听听彼此的心情</small></button>
</div>
</section>
<section id="detailView" class="view"><div class="detail-head"><button id="detailBack" class="textbtn">‹ 返回</button><span class="detail-kicker">ROSE ÉTERNELLE</span></div><div id="detailContent"></div></section>
</main>
<div id="toast" class="toast"></div><div id="modal" class="modal"><div class="modal-sheet"><button id="modalClose" class="modal-close">×</button><div id="modalContent"></div></div></div>
</div><script src="./companion.js?v=3"></script></body></html>
