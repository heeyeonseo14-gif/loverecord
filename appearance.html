{display:block}.home.hidden{display:none}.editor-head{display:flex;align-items:center;gap:10px;margin:12px 0 17px}.editor-head button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;color:inherit}.editor-head h2{font-size:19px;margin:0;flex:1}.modebar{display:flex;background:#eae7e1;border-radius:14px;padding:4px;gap:4px;margin-bottom:13px}.modebar button{flex:1;border:0;background:transparent;border-radius:11px;padding:10px;color:#716c64;font:inherit;font-size:12px}.modebar button.active{background:#fff;color:#262521;box-shadow:0 2px 8px #0000000d}.workarea{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.9fr);gap:14px;align-items:start}.controls,.preview-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}.controls h3,.preview-card h3{font-size:13px;margin:0 0 5px}.hint{color:var(--muted);font-size:11px;line-height:1.65}.field{margin:15px 0}.field label{display:flex;justify-content:space-between;gap:8px;font-size:12px;margin-bottom:7px}.field output{color:var(--muted);font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:#55514b}input[type=color]{width:48px;height:38px;border:1px solid var(--line);border-radius:10px;background:white;padding:3px}input[type=file]{width:100%;font-size:11px}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 11px;font:inherit;font-size:11px;color:inherit}.choice.active{border-color:#57534d;background:#f1efeb}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.row>*{min-width:0}.primary,.secondary,.danger{border:0;border-radius:13px;padding:11px 14px;font:inherit;font-size:12px;cursor:pointer}.primary{background:#292824;color:white}.secondary{background:#efede8;color:#393731}.danger{background:#f7e9e6;color:#8a4035}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.actions>*{flex:1}.device-wrap{background:#ebe8e2;border-radius:18px <script>
(()=>{'use strict';const $=id=>document.getElementById(id),titles={wallpaper:'桌面壁纸',font:'字体管理',icons:'图标管理',surface:'界面外观',layout:'桌面布局',themes:'主题方案',schemes:'我的设计方案'};let base=null,draft=null,undoStack=[],redoStack=[],mode='settings',active='wallpaper',iconFiles={},fontBlob=null;const appIcons=[['聊天','message-circle'],['空间','house'],['日记','book-open'],['音乐','music'],['社区','users'],['农场','sprout'],['查岗','calendar-check'],['美化','palette'],['设置','settings']];
function clone(x){return JSON.parse(JSON.stringify(x))}function toast(s){$('status').textContent=s;$('status').classList.add('show');setTimeout(()=>$('status').classList.remove('show'),1800)}function setDraft(patch){undoStack.push(clone(draft));if(undoStack.length>40)undoStack.shift();redoStack=[];draft={...draft,...patch};renderPreview();$('dirtyFlag').textContent='未应用修改'}function field(label,key,min,max,step,suffix=''){return `<div class="field"><label>${label}<output id="out-${key}">${draft[key]}${suffix}</output></label><input type="range" min="${min}" max="${max}" step="${step}" value="${draft[key]}" data-range="${key}" data-suffix="${suffix}"></div>`}function choices(key,items){return `<div class="choices">${items.map(([v,l])=>`<button class="choice ${draft[key]===v?'active':''}" data-choice="${key}" data-value="${v}">${l}</button>`).join('')}</div>`}
function renderPreview(){const c=draft||base;const page=$('previewPageFull')?.value||$('previewPage')?.value||'desktop';if($('previewPage'))$('previewPage').value=page;if($('previewPageFull'))$('previewPageFull').value=page;const pageNames={desktop:'LOVE RECORD',chat:'聊天',space:'我们的空间',diary:'日记',music:'音乐',community:'社区',farm:'我的农场',checkin:'查岗',market:'生活集市'};document.querySelectorAll('.device-head').forEach(x=>x.textContent=pageNames[page]||'LOVE RECORD');for(const id of ['device','deviceFull']){let d=$(id);if(!d)continue;d.style.setProperty('--pv-bg',c.mode==='dark'?'#252421':c.bgStart);d.style.setProperty('--pv-tile',c.iconSurface==='solid'?'#ffffff':`rgba(255,255,255,${c.iconOpacity/100})`);d.style.setProperty('--pv-blur',c.blur+'px');d.style.setProperty('--pv-ink',c.mode==='dark'?'#fff':c.text);d.style.setProperty('--pv-dock',`rgba(255,255,255,${c.opacity/100})`)}const pageItems=page==='chat'?[['颜焕','♡'],['林欣','♡'],['消息','◌']]:page==='diary'?[['今天','▤'],['心情','☾'],['回忆','▧']]:page==='music'?[['正在播放','♫'],['歌单','▤'],['收藏','♡']]:page==='farm'?[['种植','♧'],['仓库','▦'],['商店','◇']]:page==='checkin'?[['今日状态','◉'],['日程','▦'],['联系人','◎']]:page==='space'?[['客厅','⌂'],['卧室','▤'],['花园','♧']]:page==='community'?[['动态','◎'],['关注','♡'],['消息','◌']]:page==='market'?[['外卖','♨'],['购物','◇'],['订单','▤']]:appIcons;for(const id of ['deviceGrid','deviceGridFull'])$(id).innerHTML=pageItems.map(([n,ic])=>`<div class="device-app"><div class="device-icon" style="border-radius:${c.radius}px;opacity:${c.iconOpacity/100}">${({'message-circle':'◌',house:'⌂','book-open':'▤',music:'♫',users:'◎',sprout:'♧','calendar-check':'▦',palette:'◈',settings:'⚙'})[ic]}</div>${n}</div>`).join('');$('activeSwatch').style.background=`linear-gradient(135deg,${c.bgStart},${c.bgEnd})`}
function renderControls(){let h='<h3>设计参数</h3><p class="hint">调整时右侧（或上方）手机预览会同步变化。</p>';if(active==='wallpaper'){h+=`<div class="field"><label>背景主色</label><input type="color" id="bgStart" value="${draft.bgStart}"></div><div class="field"><label>背景辅助色</label><input type="color" id="bgEnd" value="${draft.bgEnd}"></div><div class="field"><label>上传壁纸图片</label><input type="file" id="wallpaperFile" accept="image/*"></div><button class="secondary" id="clearWallpaper">移除自定义壁纸</button>`}
if(active==='font'){h+=choices('font',[['system','系统字体'],['clean','简洁字体'],['serif','衬线字体'],['round','圆润字体'],['custom','自定义字体']])+`<div class="field"><label>上传 TTF / OTF 字体</label><input type="file" id="fontFile" accept=".ttf,.otf,font/ttf,font/otf"></div>`+field('正文字号','fontSize',11,24,1,'px')+`<div class="hint">自定义字体文件保存在本地浏览器数据库。</div>`}
if(active==='icons'){h+=choices('iconStyle',[['outline','黑色线性'],['filled','实心图标'],['image','自定义图片']])+choices('iconSurface',[['none','无底板'],['solid','纯色'],['frosted','磨砂'],['transparent','透明'],['liquid','液态玻璃']])+field('图标尺寸','iconSize',32,72,1,'px')+field('图标底板透明度','iconOpacity',0,100,1,'%')+`<div class="field"><label>自定义图标图片（按应用名称）</label><select id="iconTarget" style="padding:10px;border:1px solid var(--line);border-radius:10px;width:100%">${appIcons.map(([n])=>`<option>${n}</option>`).join('')}</select><input type="file" id="iconFile" accept="image/*"></div>`}
if(active==='surface'){h+=choices('mode',[['light','浅色'],['dark','深色']])+choices('iconSurface',[['solid','不透明'],['frosted','磨砂'],['transparent','透明'],['liquid','液态玻璃']])+field('UI 深浅','depth',0,100,1,'%')+field('界面透明度','opacity',0,100,1,'%')+field('磨砂程度','blur',0,60,1,'px')+field('圆角程度','radius',0,40,1,'px')+field('阴影强度','shadow',0,100,1,'%')+field('边框透明度','borderOpacity',0,100,1,'%')+`<div class="field"><label>强调色</label><input type="color" id="accent" value="${draft.accent}"></div>`}
if(active==='layout'){h+=field('图标尺寸','iconSize',32,72,1,'px')+field('图标透明度','iconOpacity',0,100,1,'%')+choices('iconStyle',[['outline','线性图标'],['filled','实心图标']])+`<div class="field"><label>应用名称显示</label>${choices('showAppNames',[[true,'显示'],[false,'隐藏']])}</div>`}
if(active==='themes'){h+=`<p class="hint">选择预设主题会更新临时设计，确认应用后才正式生效。</p><div class="choices">${[['purple','柔雾紫'],['cream','奶油白'],['dark','黑色磨砂'],['whiteglass','白色玻璃'],['mono','黑白灰']].map(([v,l])=>`<button class="choice" data-preset="${v}">${l}</button>`).join('')}</div>`+`<div class="field"><label>自定义强调色</label><input type="color" id="accent" value="${draft.accent}"></div>`}
$('controls').innerHTML=h;bindControls()}
function bindControls(){$('controls').querySelectorAll('[data-range]').forEach(el=>el.oninput=()=>{let k=el.dataset.range,v=+el.value;if(k==='depth'){let x=Math.round(248-v*1.8);setDraft({bgStart:`rgb(${x},${x},${x-2})`,bgEnd:`rgb(${Math.max(0,x-8)},${Math.max(0,x-8)},${Math.max(0,x-10)})`})}else setDraft({[k]:v});$('out-'+k).textContent=v+el.dataset.suffix});$('controls').querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{let v=b.dataset.value;if(v==='true')v=true;if(v==='false')v=false;setDraft({[b.dataset.choice]:v});renderControls()});$('controls').querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{let p=b.dataset.preset;let c=p==='purple'?{bgStart:'#f2e8f5',bgEnd:'#e9dfee',accent:'#b79bc7',mode:'light'}:p==='cream'?{bgStart:'#f8f4ed',bgEnd:'#eee9e1',accent:'#77716b',mode:'light'}:p==='dark'?{bgStart:'#242321',bgEnd:'#171716',accent:'#bcb4a8',mode:'dark',iconSurface:'frosted'}:p==='whiteglass'?{bgStart:'#f7f7f5',bgEnd:'#e9e9e6',accent:'#777',mode:'light',iconSurface:'liquid'}:{bgStart:'#efefed',bgEnd:'#d9d9d6',accent:'#333',mode:'light',iconSurface:'solid'};setDraft(c);renderControls()});['bgStart','bgEnd','accent'].forEach(id=>{let e=$(id);if(e)e.oninput=()=>setDraft({[id]:e.value})});let wf=$('wallpaperFile');if(wf)wf.onchange=async e=>{let f=e.target.files[0];if(!f)return;let data=await readImage(f);setDraft({wallpaper:data});toast('壁纸已加入临时预览')};$('clearWallpaper')?.addEventListener('click',()=>setDraft({wallpaper:null}));let ff=$('fontFile');if(ff)ff.onchange=async e=>{fontBlob=e.target.files[0];if(fontBlob){setDraft({font:'custom',customFontName:fontBlob.name});toast('字体已选择，应用设计后保存')}};let iff=$('iconFile');if(iff)iff.onchange=async e=>{let f=e.target.files[0];if(!f)return;let data=await readImage(f);iconFiles[$('iconTarget').value]=data;toast('图标图片已准备，应用设计后保存')}}
function readImage(file){return new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{let img=new Image();img.onload=()=>{let scale=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.9))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
function openEditor(section){active=section;base=clone(window.LRTheme.defaults);draft=clone(window.__LR_THEME_CONFIG__||base);base=clone(draft);undoStack=[];redoStack=[];$('home').classList.add('hidden');$('schemesPage').classList.remove('active');$('editor').classList.add('active');$('editorTitle').textContent=titles[section];$('dirtyFlag').textContent='临时编辑';$('previewFull').classList.remove('active');$('workarea').classList.remove('hidden');$('editor').classList.remove('preview-mode');mode='settings';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode==='settings'));renderControls();renderPreview()}
function switchMode(m){mode=m;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));$('editor').classList.toggle('preview-mode',m==='preview');$('previewFull').classList.toggle('active',m==='preview');$('workarea').classList.toggle('hidden',m==='preview');if(m==='preview')$('previewFull').scrollIntoView({behavior:'smooth',block:'start'})}
async function apply(){try{await LRTheme.save(draft);if(draft.wallpaper){await LRTheme.assetPut('lr-theme-wallpaper-v1',draft.wallpaper);await LRTheme.assetPut('homepage-background',draft.wallpaper)}else{await LRTheme.assetDelete('homepage-background').catch(()=>{});await LRTheme.assetDelete('lr-theme-wallpaper-v1').catch(()=>{})}if(fontBlob)await LRTheme.assetPut('custom-font',fontBlob);for(const [name,data] of Object.entries(iconFiles)){let id=({'聊天':'app-chat','空间':'app-space','日记':'app-journal','音乐':'app-music','社区':'app-community','农场':'app-games','查岗':'app-checkin','美化':'app-appearance','设置':'app-settings'})[name];if(id)await LRTheme.assetPut('home-icon:'+id,data)}base=clone(draft);$('dirtyFlag').textContent='已应用';toast('设计已应用到 LOVE RECORD');$('activeName').textContent='自定义设计';$('home').classList.remove('hidden');$('editor').classList.remove('active');$('editor').classList.add('hidden');setTimeout(()=>location.href='index.html?theme='+Date.now(),450)}catch(e){toast('应用失败，原有设置未更改：'+e.message)}}
function closeEditor(cancel){if(cancel&&JSON.stringify(draft)!==JSON.stringify(base)&&!confirm('放弃本次尚未应用的修改吗？'))return;$('editor').classList.remove('active');$('editor').classList.add('hidden');$('home').classList.remove('hidden')}
document.querySelectorAll('[data-section]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.section==='schemes'){openSchemes();return}openEditor(b.dataset.section)}));$('backSections').onclick=()=>closeEditor(true);$('cancelEdit').onclick=()=>closeEditor(true);$('applyDesign').onclick=apply;$('resetDraft').onclick=()=>{if(!confirm('重新设计将恢复本次编辑开始时的状态，继续吗？'))return;draft=clone(base);undoStack=[];redoStack=[];renderControls();renderPreview()};$('undo').onclick=()=>{if(!undoStack.length)return;redoStack.push(clone(draft));draft=undoStack.pop();renderControls();renderPreview()};$('redo').onclick=()=>{if(!redoStack.length)return;undoStack.push(clone(draft));draft=redoStack.pop();renderControls();renderPreview()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));$('previewPage').onchange=renderPreview;$('previewPageFull').onchange=renderPreview;
async function openSchemes(){ $('home').classList.add('hidden');$('editor').classList.remove('active');$('editor').classList.add('hidden');$('schemesPage').classList.add('active');await renderSchemes()}$('backSchemes').onclick=()=>{$('schemesPage').classList.remove('active');$('home').classList.remove('hidden')};async function getSchemes(){return await LRTheme.assetGet('lr-theme-schemes-v1')||[]}async function putSchemes(x){await LRTheme.assetPut('lr-theme-schemes-v1',x)}async function renderSchemes(){let list=await getSchemes();$('schemeList').innerHTML=list.length?list.map((s,i)=>`<div class="scheme"><span><b>${escapeHTML(s.name)}</b><br><small class="sub">${s.date||'已保存'}</small></span><button data-load="${i}">预览/应用</button><button data-copy="${i}">复制</button><button data-del="${i}">删除</button></div>`).join(''):'<p class="hint">还没有保存的方案。</p>';document.querySelectorAll('[data-load]').forEach(b=>b.onclick=async()=>{let s=list[+b.dataset.load];if(confirm('应用方案「'+s.name+'」？')){await LRTheme.save(s.config);toast('方案已应用');location.href='index.html'}});document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async()=>{let s=clone(list[+b.dataset.copy]);s.name+=' 副本';list.push(s);await putSchemes(list);renderSchemes()});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('删除这个设计方案？')){list.splice(+b.dataset.del,1);await putSchemes(list);renderSchemes()}})}$('saveScheme').onclick=async()=>{let name=$('schemeName').value.trim()||'我的设计方案';let list=await getSchemes();list.push({name,date:new Date().toLocaleDateString('zh-CN'),config:clone(window.__LR_THEME_CONFIG__||base)});await putSchemes(list);$('schemeName').value='';renderSchemes();toast('设计方案已保存')};$('exportSchemes').onclick=async()=>{let data=JSON.stringify(await getSchemes(),null,2),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download='LOVE-RECORD-theme-schemes.json';a.click();URL.revokeObjectURL(a.href)};$('importSchemes').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x))throw Error('格式不正确');await putSchemes([...(await getSchemes()),...x]);renderSchemes();toast('方案导入成功')}catch(err){toast('导入失败：'+err.message)}e.target.value=''};
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
(async()=>{try{base=await LRTheme.load();window.__LR_THEME_CONFIG__=base;$('activeName').textContent=base.preset==='purple'?'柔雾紫':'自定义设计';renderPreview()}catch(e){toast('读取主题设置失败')}})();
})();
</script></body></html>
