<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9dff1"><title>美化 · LOVE RECORD</title>
<style>
:root{--accent:#b79bc7;--bg-a:#f2e8f5;--bg-b:#e9dfee;--radius:29px;--blur:8px;--opacity:.94;--font-size:15px;--card-shadow:0 14px 38px rgba(77,58,88,.08)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font:var(--font-size)/1.55 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#51475a;background:linear-gradient(145deg,var(--bg-a),var(--bg-b));background-attachment:fixed;transition:background .25s,color .25s;padding:18px 14px 36px}body.dark{color:#eee6f4;background:linear-gradient(145deg,#211a29,#34283d)}body.photo-bg{background-size:cover;background-position:center;background-attachment:fixed}.wrap{max-width:680px;margin:0 auto}.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.back{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.45);color:inherit;border-radius:14px;padding:10px 13px;text-decoration:none;backdrop-filter:blur(14px)}.eyebrow{font-size:10px;letter-spacing:2.2px;opacity:.62}.top h1{font-size:23px;letter-spacing:1px;margin:2px 0}.sub{font-size:12px;opacity:.67}.panel{margin:12px 0;padding:17px;border:1px solid rgba(255,255,255,.66);border-radius:var(--radius);background:rgba(255,255,255,var(--opacity));box-shadow:var(--card-shadow);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur))}body.dark .panel{background:rgba(43,34,52,var(--opacity));border-color:rgba(255,255,255,.12)}h2{font-size:13px;letter-spacing:1.8px;margin:0 0 4px}.preview{background:linear-gradient(145deg,var(--bg-a),var(--bg-b));border:1px solid rgba(255,255,255,.6);border-radius:calc(var(--radius) - 5px);padding:20px}.preview-card{margin-top:14px;padding:17px;border-radius:var(--radius);background:rgba(255,255,255,var(--opacity));backdrop-filter:blur(var(--blur));box-shadow:var(--card-shadow)}body.dark .preview-card{background:rgba(43,34,52,var(--opacity))}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}.opt,button{font:inherit;cursor:pointer}.opt,.action{border:1px solid rgba(153,128,168,.22);border-radius:15px;background:rgba(255,255,255,.42);color:inherit;padding:12px;text-align:center}.opt.active{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 20%,white);box-shadow:inset 0 0 0 1px var(--accent)}body.dark .opt,body.dark .action{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.12)}.range{display:grid;grid-template-columns:1fr 56px;align-items:center;gap:10px;margin:10px 0 14px}input[type=range]{width:100%;accent-color:var(--accent)}.value{text-align:right;font-size:12px;opacity:.72}label{display:block;font-size:11px;letter-spacing:1px;opacity:.75;margin:12px 0 5px}.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.swatch{width:32px;height:32px;border:3px solid rgba(255,255,255,.8);outline:1px solid transparent;border-radius:50%;padding:0}.swatch.active{outline:2px solid var(--accent);outline-offset:2px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}.action{flex:1;min-width:120px}.primary{background:var(--accent);border-color:transparent;color:white}.status{position:sticky;bottom:12px;text-align:center;font-size:12px;margin-top:12px;pointer-events:none}.status span{display:inline-block;background:rgba(55,45,62,.88);color:white;padding:8px 14px;border-radius:999px;opacity:0;transition:opacity .2s}.status.show span{opacity:1}input[type=color]{width:50px;height:42px;padding:3px;border:1px solid rgba(153,128,168,.25);border-radius:12px;background:transparent}input[type=file]{max-width:100%;font-size:12px}small{opacity:.65}@media(max-width:380px){body{padding:13px 10px}.panel{padding:14px}.grid{gap:7px}.opt{padding:10px 6px}}
</style></head><body><main class="wrap"><header class="top"><a class="back" href="index.html" aria-label="返回主页">←</a><div><div class="eyebrow">LOVE RECORD · PERSONALIZE</div><h1>美化</h1><div class="sub">把整个 LOVE RECORD 调整成你喜欢的样子</div></div></header>
<section class="panel"><div class="preview" id="preview"><div class="eyebrow">LIVE PREVIEW</div><div style="font-size:22px;letter-spacing:2px;margin-top:8px">LOVE RECORD</div><div class="preview-card"><div class="eyebrow">A LITTLE MOMENT</div><div style="font-size:16px;line-height:1.8;margin-top:8px">今天也想和你待在一起。</div><button class="action primary" style="margin-top:13px">A SOFT BUTTON</button></div></div></section>
<section class="panel"><h2>PRESETS · 一键换整套气质</h2><div class="grid" id="presetGrid"></div></section>
<section class="panel"><h2>FONT · 字体</h2><div class="grid" id="fontGrid"></div><label>FONT SIZE · 正文字号</label><div class="range"><input id="fontSize" type="range" min="13" max="19" step="1"><div class="value" id="fontSizeVal"></div></div><label>TITLE SCALE · 标题大小</label><div class="range"><input id="titleScale" type="range" min="0.85" max="1.25" step="0.05"><div class="value" id="titleScaleVal"></div></div></section>
<section class="panel"><h2>ACCENT COLOR · 强调色</h2><div class="sub">按钮、重点和小圆点都会跟着变。</div><div class="swatches" id="swatches"></div><div class="actions"><input type="color" id="customAccent" value="#b79bc7"><button class="action" id="useAccent">使用自定义颜色</button></div></section>
<section class="panel"><h2>BACKGROUND · 背景</h2><div class="grid" id="backgroundGrid"></div><label>BACKGROUND PHOTO · 背景照片</label><input id="bgFile" type="file" accept="image/*"><small>照片会压缩后保存在本机浏览器中。</small></section>
<section class="panel"><h2>CARDS · 卡片与毛玻璃</h2><label>圆角 CORNER RADIUS</label><div class="range"><input id="radius" type="range" min="16" max="38" step="1"><div class="value" id="radiusVal"></div></div><label>毛玻璃 GLASS BLUR</label><div class="range"><input id="blur" type="range" min="0" max="24" step="2"><div class="value" id="blurVal"></div></div><label>卡片透明度 CARD OPACITY</label><div class="range"><input id="opacity" type="range" min="0.72" max="1" step="0.02"><div class="value" id="opacityVal"></div></div></section>
<section class="panel"><h2>MODE · 显示模式</h2><div class="grid"><button class="opt" id="light">LIGHT · 浅色</button><button class="opt" id="dark">DARK · 深色</button></div><h2 style="margin-top:18px">MOTION · 动效</h2><button class="action" id="motion" style="margin-top:10px;width:100%">MOTION ON</button></section>
<section class="panel"><div class="actions"><button class="action" id="reset">恢复默认</button><a class="action primary" href="index.html" style="text-decoration:none">保存并返回主页</a></div><div class="sub" style="margin-top:10px">设置会写入与主页共用的外观配置。</div></section><div class="status" id="status"><span>已保存</span></div></main>
<script>
const KEY='yanyan-love-appearance-v1';
const defaults={preset:'purple',font:'system',fontSize:15,titleScale:1,accent:'#b79bc7',bg:'soft',radius:29,blur:0,opacity:.94,dark:false,motion:true};
let a={...defaults};try{a={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){}
const fonts={system:{name:'SYSTEM 系统',value:'-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif'},clean:{name:'CLEAN 简洁',value:'Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif'},serif:{name:'SERIF 衬线',value:'Georgia,"Times New Roman",serif'},round:{name:'ROUND 圆润',value:'ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif'}};
const bgs={soft:{name:'柔雾紫',a:'#f2e8f5',b:'#e9dfee'},cream:{name:'清晨奶油',a:'#f8f1e7',b:'#eee4d7'},mist:{name:'雾蓝',a:'#e8eef7',b:'#dfe7f1'},rose:{name:'柔和玫瑰',a:'#f6e9ef',b:'#eadce5'},plain:{name:'干净纯色',a:'#f7f3f9',b:'#f7f3f9'}};
const presets={purple:{name:'柔雾紫',font:'system',fontSize:15,titleScale:1,accent:'#b79bc7',bg:'soft',radius:29,blur:8,opacity:.92,dark:false,motion:true},night:{name:'夜色紫',font:'serif',fontSize:15,titleScale:1.04,accent:'#9f83bd',bg:'soft',radius:26,blur:14,opacity:.78,dark:true,motion:true},cream:{name:'清晨奶油',font:'round',fontSize:16,titleScale:1.02,accent:'#b79bc7',bg:'cream',radius:32,blur:4,opacity:.96,dark:false,motion:false}};
const $=id=>document.getElementById(id);let timer;
const BG_DB='lr-appearance-assets-v1',BG_STORE='assets',BG_ID='background-photo';
function openBgDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('浏览器不支持图片存储'));const req=indexedDB.open(BG_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(BG_STORE))req.result.createObjectStore(BG_STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('打开图片存储失败'))})}
async function putBg(data){const db=await openBgDB();return new Promise((resolve,reject)=>{const tx=db.transaction(BG_STORE,'readwrite');tx.objectStore(BG_STORE).put(data,BG_ID);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error||new Error('写入图片失败'))};tx.onabort=()=>{db.close();reject(tx.error||new Error('写入图片失败'))}})}
async function getBg(){const db=await openBgDB();return new Promise((resolve,reject)=>{const tx=db.transaction(BG_STORE,'readonly'),req=tx.objectStore(BG_STORE).get(BG_ID);req.onsuccess=()=>{db.close();resolve(req.result||'')};req.onerror=()=>{db.close();reject(req.error)}})}
async function save(){try{const config={...a};delete config.bgData;if(a.bgData)await putBg(a.bgData);localStorage.setItem(KEY,JSON.stringify(config));$('status').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('status').classList.remove('show'),1400)}catch(e){alert('保存失败：'+(e?.message||'手机浏览器无法写入本地图片存储'))}} 
function compressDataUrl(dataUrl,maxSide=900,quality=.55){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{try{const scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));const ctx=c.getContext('2d');if(!ctx)throw new Error('canvas unavailable');ctx.drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',quality))}catch(err){reject(err)}};img.onerror=reject;img.src=dataUrl})}
function apply(){const bg=bgs[a.bg]||bgs.soft;document.documentElement.style.setProperty('--accent',a.accent);document.documentElement.style.setProperty('--bg-a',bg.a);document.documentElement.style.setProperty('--bg-b',bg.b);document.documentElement.style.setProperty('--radius',a.radius+'px');document.documentElement.style.setProperty('--blur',a.blur+'px');document.documentElement.style.setProperty('--opacity',a.opacity);document.documentElement.style.setProperty('--font-size',a.fontSize+'px');document.body.style.fontFamily=fonts[a.font]?.value||fonts.system.value;document.body.classList.toggle('dark',!!a.dark);document.body.classList.toggle('photo-bg',!!a.bgData);document.body.style.backgroundImage=a.bgData?'linear-gradient(rgba(240,230,245,.35),rgba(240,230,245,.35)),url("'+a.bgData+'")':'';document.documentElement.style.setProperty('--card-shadow',a.dark?'0 18px 45px rgba(0,0,0,.25)':'0 18px 45px rgba(77,58,88,.07)');$('preview').style.fontFamily=fonts[a.font]?.value||fonts.system.value;save();renderStates()}
function renderStates(){for(const id of ['fontSize','titleScale','radius','blur','opacity'])$(id).value=a[id==='fontSize'?'fontSize':id==='titleScale'?'titleScale':id];$('fontSizeVal').textContent=a.fontSize+'px';$('titleScaleVal').textContent=Math.round(a.titleScale*100)+'%';$('radiusVal').textContent=a.radius+'px';$('blurVal').textContent=a.blur+'px';$('opacityVal').textContent=Math.round(a.opacity*100)+'%';$('customAccent').value=a.accent;$('light').classList.toggle('active',!a.dark);$('dark').classList.toggle('active',a.dark);$('motion').textContent=a.motion?'MOTION ON · 动效开启':'MOTION OFF · 动效关闭';document.querySelectorAll('[data-preset]').forEach(x=>x.classList.toggle('active',x.dataset.preset===a.preset));document.querySelectorAll('[data-font]').forEach(x=>x.classList.toggle('active',x.dataset.font===a.font));document.querySelectorAll('[data-bg]').forEach(x=>x.classList.toggle('active',x.dataset.bg===a.bg));document.querySelectorAll('[data-accent]').forEach(x=>x.classList.toggle('active',x.dataset.accent===a.accent))}
function render(){ $('presetGrid').innerHTML=Object.entries(presets).map(([k,v])=>`<button class="opt ${a.preset===k?'active':''}" data-preset="${k}">${v.name}</button>`).join('');$('fontGrid').innerHTML=Object.entries(fonts).map(([k,v])=>`<button class="opt ${a.font===k?'active':''}" data-font="${k}" style="font-family:${v.value}">${v.name}</button>`).join('');$('backgroundGrid').innerHTML=Object.entries(bgs).map(([k,v])=>`<button class="opt ${a.bg===k?'active':''}" data-bg="${k}">${v.name}</button>`).join('');$('swatches').innerHTML=['#b79bc7','#c89bb0','#9faed0','#a9c4a2','#c7ad8b','#8e6fae'].map(c=>`<button class="swatch ${a.accent===c?'active':''}" data-accent="${c}" style="background:${c}" aria-label="${c}"></button>`).join('');renderStates()}
function preset(k){a={...defaults,...presets[k],preset:k};apply()}
$('presetGrid').addEventListener('click',e=>{const b=e.target.closest('[data-preset]');if(b)preset(b.dataset.preset)});$('fontGrid').addEventListener('click',e=>{const b=e.target.closest('[data-font]');if(b){a.font=b.dataset.font;a.preset='custom';apply()}});$('backgroundGrid').addEventListener('click',e=>{const b=e.target.closest('[data-bg]');if(b){a.bg=b.dataset.bg;a.preset='custom';apply()}});$('swatches').addEventListener('click',e=>{const b=e.target.closest('[data-accent]');if(b){a.accent=b.dataset.accent;a.preset='custom';apply()}});
for(const [id,key] of [['fontSize','fontSize'],['titleScale','titleScale'],['radius','radius'],['blur','blur'],['opacity','opacity']])$(id).addEventListener('input',e=>{a[key]=Number(e.target.value);a.preset='custom';apply()});$('useAccent').onclick=()=>{a.accent=$('customAccent').value;a.preset='custom';apply()};$('light').onclick=()=>{a.dark=false;a.preset='custom';apply()};$('dark').onclick=()=>{a.dark=true;a.preset='custom';apply()};$('motion').onclick=()=>{a.motion=!a.motion;a.preset='custom';apply()};$('reset').onclick=()=>{a={...defaults};apply();render()};$('bgFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const url=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});a.bgData=await compressDataUrl(url,900,.55);a.bg='plain';a.preset='custom';apply()}catch(err){alert('背景照片读取失败，请换一张试试')}finally{e.target.value=''}};
render();apply();getBg().then(data=>{if(data){a.bgData=data;apply()}}).catch(()=>{});
</script></body></html>
